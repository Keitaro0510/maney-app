<div class="mbg open" id="shift-mbg">
<div class="modal">
<div class="modal-handle">
</div>
<h3>シフトを追加</h3>
<div class="fg">
<label for="m-job">バイト先</label>
<select id="m-job">
<option value="カフェ">カフェ</option>
</select>
</div>
<div class="fgr">
<div class="fg">
<label for="m-start">出勤</label>
<input type="time" id="m-start" value="09:00">
</div>
<div class="fg">
<label for="m-end">退勤</label>
<input type="time" id="m-end" value="17:00" aria-describedby="m-time-err" aria-invalid="false">
</div>
</div>
<div class="form-err" id="m-time-err" role="alert" hidden="">退勤は、出勤より後の時刻にしてください（日をまたぐシフトは登録できません）</div>
<div class="fg">
<label for="m-rest">休憩時間（分）</label>
<div class="pay-chips" id="m-rest-chips">
<button type="button" class="pay-chip sel" data-shift-action="rest" data-minutes="0" aria-pressed="true">なし</button>
<button type="button" class="pay-chip" data-shift-action="rest" data-minutes="45" aria-pressed="false">45分</button>
<button type="button" class="pay-chip" data-shift-action="rest" data-minutes="60" aria-pressed="false">60分</button>
<button type="button" class="pay-chip" data-shift-action="rest" data-minutes="90" aria-pressed="false">90分</button>
</div>
<input type="number" id="m-rest" value="0" min="0" step="5" placeholder="例: 60">
</div>
<div style="background: var(--color-background-secondary); border-radius: var(--border-radius-md); padding: 10px 12px; margin-bottom: 12px; font-size: 13px;">1日: <strong id="m-prev">¥10,400</strong>（深夜:<span id="m-night">0.0h</span>　休憩:<span id="m-rest-lbl">0分</span>）交通費:<strong id="m-transport">¥400</strong> 合計:<strong id="m-prev-total">¥10,800</strong>
</div>
<div class="fg">
<label>日付を選択（複数OK）</label>
<div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px;">
<span id="m-month-lbl" style="font-size: 13px; color: var(--color-text-secondary); font-weight: 500;">2026年11月</span>
<div style="display: flex; gap: 6px;">
<button class="btn sm" data-shift-action="cal-prev">←</button>
<button class="btn sm" data-shift-action="cal-next">→</button>
</div>
</div>
<div style="display: grid; grid-template-columns: repeat(7, 1fr); gap: 3px; margin-bottom: 4px;" id="shift-cal-dow">
<div style="font-size: 11px; color: var(--color-text-secondary); text-align: center; font-weight: 500;">日</div>
<div style="font-size: 11px; color: var(--color-text-secondary); text-align: center; font-weight: 500;">月</div>
<div style="font-size: 11px; color: var(--color-text-secondary); text-align: center; font-weight: 500;">火</div>
<div style="font-size: 11px; color: var(--color-text-secondary); text-align: center; font-weight: 500;">水</div>
<div style="font-size: 11px; color: var(--color-text-secondary); text-align: center; font-weight: 500;">木</div>
<div style="font-size: 11px; color: var(--color-text-secondary); text-align: center; font-weight: 500;">金</div>
<div style="font-size: 11px; color: var(--color-text-secondary); text-align: center; font-weight: 500;">土</div>
</div>
<div id="shift-cal-grid" style="display: grid; grid-template-columns: repeat(7, 1fr); gap: 3px;">
<button type="button" class="chk-day" aria-label="11月1日" data-shift-action="day" data-date="2026-11-01" data-other="false" aria-pressed="false">1</button>

<button type="button" class="chk-day off" aria-label="12月5日" data-shift-action="day" data-date="2026-12-05" data-other="true" aria-pressed="false">5</button>
</div>
<div style="font-size: 13px; color: var(--color-text-secondary); margin-top: 8px;">選択中: <span id="sel-days-count">0日</span>　合計: <strong id="m-total-all">¥0</strong>
</div>
</div>
<div style="display: flex; gap: 8px; justify-content: flex-end;">
<button class="btn" data-shift-action="close-shift">キャンセル</button>
<button class="btn primary" data-shift-action="save-shift">一括保存</button>
</div>
</div>
</div>
