<div class="mbg open" id="ldg-mbg">
<div class="modal">
<div class="modal-handle">
</div>
<h3>収支を記録</h3>
<div class="pay-chips" id="ldg-type-chips">
<button type="button" class="pay-chip sel" onclick="selLdgType('expense')" aria-pressed="true">支出</button>
<button type="button" class="pay-chip" onclick="selLdgType('income')" aria-pressed="false">収入</button>
</div>
<div class="fg">
<label for="ldg-amount">金額 (¥)</label>
<input type="number" inputmode="numeric" id="ldg-amount" placeholder="1500">
</div>
<div class="fg" id="ldg-cat-wrap">
<label>カテゴリ</label>
<div class="cat-chips" id="cat-chips" role="group" aria-label="カテゴリ">
<button type="button" class="chip sel" onclick="selCat('食費')" aria-pressed="true">食費</button>
<button type="button" class="chip" onclick="selCat('交通費')" aria-pressed="false">交通費</button>
<button type="button" class="chip" onclick="selCat('その他')" aria-pressed="false">その他</button>
</div>
</div>
<div class="fg" id="ldg-pay-wrap" style="display: block;">
<label>支払い方法</label>
<div class="pay-chips" id="ldg-pay-chips" role="group" aria-label="支払い方法">
<button type="button" class="pay-chip sel" onclick="selPayAt(0)" aria-pressed="true">現金</button>
<button type="button" class="pay-chip" onclick="selPayAt(1)" aria-pressed="false">口座</button>
<button type="button" class="pay-chip" onclick="selPayAt(2)" aria-pressed="false">Aカード</button>
<button type="button" class="pay-chip" onclick="selPayAt(3)" aria-pressed="false">Bカード</button>
</div>
<div class="hint" id="ldg-pay-hint">現金は、ATM で引き出したときに口座から引いています</div>
</div>
<div class="fg" id="ldg-receive-wrap" style="display: none;">
<label>受取方法</label>
<div class="pay-chips" id="ldg-receive-chips" role="group" aria-label="受取方法">
</div>
<div class="hint" id="ldg-receive-hint">現金受取は口座残高に影響しません</div>
</div>
<div class="fg">
<label for="ldg-name" id="ldg-name-label">名前</label>
<input id="ldg-name" placeholder="ランチ、交通費など" aria-describedby="ldg-name-err">
<div class="task-field-err" id="ldg-name-err" role="alert" hidden="">毎月のお金には名前を入れてください（家賃・動画のサブスクなど）</div>
</div>
<div class="fg">
<label for="ldg-date">日付</label>
<input type="date" id="ldg-date" onchange="renderLdgRepeat()">
</div>
<label class="ldg-repeat">
<input type="checkbox" id="ldg-repeat" onchange="renderLdgRepeat()">
<span>毎月くり返す</span>
</label>
<div class="ldg-repeat-hint" id="ldg-repeat-hint" hidden="">
</div>
<div class="fg" id="ldg-memo-wrap">
<label for="ldg-memo">メモ</label>
<textarea id="ldg-memo" placeholder="任意">
</textarea>
</div>
<div style="display: flex; gap: 8px; justify-content: flex-end;">
<button class="btn" onclick="closeLdgModal()">キャンセル</button>
<button class="btn primary" onclick="saveLedger()">保存</button>
</div>
</div>
</div>
