<div class="mbg open" id="job-edit-mbg">
<div class="modal">
<div class="modal-handle">
</div>
<h3>バイト先を編集</h3>
<div class="fgr">
<div class="fg">
<label for="je-name">名前</label>
<input id="je-name" placeholder="カフェなど">
</div>
<div class="fg">
<label for="je-wage">通常時給 (¥)</label>
<input id="je-wage" type="number" placeholder="1100">
</div>
</div>
<div class="fgr3">
<div class="fg">
<label for="je-night-start">深夜開始</label>
<input id="je-night-start" type="time">
</div>
<div class="fg">
<label for="je-night-rate">深夜割増(%)</label>
<input id="je-night-rate" type="number">
</div>
<div class="fg">
<label for="je-transport">交通費(片道¥)</label>
<input id="je-transport" type="number" placeholder="230">
</div>
</div>
<div class="fgr">
<div class="fg">
<label for="je-close-day">締め日</label>
<input id="je-close-day" type="number" min="1" max="31" placeholder="31（末日）">
</div>
<div class="fg">
<label for="je-pay-day">給料日（翌月）</label>
<input id="je-pay-day" type="number" min="1" max="31" placeholder="10">
</div>
</div>
<div class="fg">
<label>カレンダーの色</label>
<div class="color-swatches" id="je-color-swatches" role="group" aria-label="カレンダーの色">
<button type="button" class="color-swatch" style="background: rgb(224, 96, 128);" data-shift-action="edit-color" data-color="pink" aria-label="ピンク" aria-pressed="false">
</button>
<button type="button" class="color-swatch sel" style="background: rgb(58, 143, 224);" data-shift-action="edit-color" data-color="blue" aria-label="青" aria-pressed="true">
</button>
<button type="button" class="color-swatch" style="background: rgb(92, 160, 32);" data-shift-action="edit-color" data-color="green" aria-label="緑" aria-pressed="false">
</button>
<button type="button" class="color-swatch" style="background: rgb(224, 144, 48);" data-shift-action="edit-color" data-color="orange" aria-label="オレンジ" aria-pressed="false">
</button>
<button type="button" class="color-swatch" style="background: rgb(112, 96, 208);" data-shift-action="edit-color" data-color="purple" aria-label="紫" aria-pressed="false">
</button>
<button type="button" class="color-swatch" style="background: rgb(32, 144, 112);" data-shift-action="edit-color" data-color="teal" aria-label="青緑" aria-pressed="false">
</button>
</div>
</div>
<div style="display: flex; gap: 8px; justify-content: flex-end;">
<button class="btn" data-shift-action="close-job-edit">キャンセル</button>
<button class="btn primary" data-shift-action="save-job-edit">保存</button>
</div>
</div>
</div>
