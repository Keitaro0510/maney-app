# CI: PR を出したときと、main に入ったときに、テストを自動で動かす
# 動かすのは Node だけで通るテスト（データの層・互換層・保存）。
# 結合テスト（tests/integration）は、別の仕事でローカルの Supabase を立てて流す（D19）。DB のテスト（supabase/tests）は、まだここでは動かさない。
name: テスト

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch: # GitHub の画面から手で動かすこともできる

# 読むだけでよい（リポジトリに書き込まない）
permissions:
  contents: read

# 同じブランチに続けて push したら、古いほうの実行は止める
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Node のテスト
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: node --test "tests/*.test.mjs"
      # 公開の手順（deploy.yml）と同じやり方で、公開するファイルを試しに作る（マージする前に失敗に気づけるように）
      - name: 部品を入れる（package-lock.json のとおり）
        run: npm ci
      # js/ の型の検査（checkJs。D4 の手順3・D16）。型の間違いがあるとマージできない
      - name: 型の検査
        run: npm run typecheck
      - name: 公開するファイルを試しに作る
        env:
          MANEY_TARGET: prod # 公開と同じく本番につなぐ（D19）
        run: bash scripts/build-pages.sh "$RUNNER_TEMP/_site"

  integration:
    name: 結合テスト（ローカルの Supabase）
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: 部品を入れる（Supabase CLI も。版は package.json）
        run: npm ci
      # 全部のマイグレーションを当てた、空の DB から始まる。結合テストに要るのは DB・認証（gotrue）・API（postgrest・kong）だけ
      - name: ローカルの Supabase を立てる
        run: npx supabase start -x realtime,storage-api,imgproxy,mailpit,postgres-meta,studio,edge-runtime,logflare,vector,supavisor
      - name: 結合テスト
        run: npm run test:integration
