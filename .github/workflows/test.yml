# CI: PR を出したときと、main に入ったときに、テストを自動で動かす
# 動かすのは Node だけで通るテスト（データの層・互換層・保存）。
# ローカルの Supabase が要るテスト（tests/integration、supabase/tests）は、まだここでは動かさない。
name: テスト

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch: # GitHub の画面から手で動かすこともできる

# 読むだけでよい（リポジトリに書き込まない）
permissions:
  contents: read

# 同じブランチに続けて push したら、古いほうの実行は止める
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Node のテスト
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: node --test "tests/*.test.mjs"
